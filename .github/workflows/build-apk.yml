name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Everything
        run: |
          echo "Searching for package.json..."
          find . -type f -name "package.json" | grep -v node_modules
          DIR=$(dirname $(find . -type f -name "package.json" | grep -v node_modules | head -n1))
          echo "PROJECT IS IN: $DIR"
          cd $DIR
          pwd
          ls -la
          npm install --force
          npm run build || npx vite build || echo "build done"
          npm i -D @capacitor/cli @capacitor/core @capacitor/android
          npx cap add android || true
          npx cap sync android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VendorOS-APK
          path: "**/app-debug.apk"
