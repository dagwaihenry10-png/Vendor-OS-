name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies & Build Web (Vite / React / Capacitor)
        run: |
          if [ -f "package.json" ]; then
            echo "package.json found. Installing dependencies..."
            if [ -f "package-lock.json" ]; then
              npm ci || npm install --legacy-peer-deps
            else
              npm install --legacy-peer-deps
            fi
            
            # Check for build script
            if grep -q '"build":' package.json; then
              echo "Building web project with Vite..."
              npm run build
            fi

            # Check for Capacitor
            if [ -f "capacitor.config.ts" ] || [ -f "capacitor.config.json" ] || [ -f "capacitor.config.js" ]; then
              echo "Capacitor config detected. Syncing web assets to Android platform..."
              npx cap sync android || npx cap copy android
            fi
          else
            echo "Pure Android Gradle project detected. Proceeding to Gradle build..."
          fi

      - name: Setup & Verify Gradle Wrapper
        run: |
          if [ -d "android" ] && ([ -f "android/build.gradle" ] || [ -f "android/build.gradle.kts" ]); then
            TARGET_DIR="android"
          else
            TARGET_DIR="."
          fi
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          
          cd "$TARGET_DIR"
          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found. Generating gradle wrapper..."
            gradle wrapper || gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          cd "$TARGET_DIR"
          echo "Compiling APK with Gradle..."
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VendorOS-APK
          path: |
            **/build/outputs/apk/**/*.apk
            !**/build/outputs/apk/**/*-unaligned.apk
          if-no-files-found: error
