name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SHOW ME YOUR FILES
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== FIND ALL ==="
          find . -type f | head -n 100
          echo "=== PACKAGE.JSON LOCATION ==="
          find . -name "package.json" -not -path "*/node_modules/*"
          echo "=== DONE ==="
